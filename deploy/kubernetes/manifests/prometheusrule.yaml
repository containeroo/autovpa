---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: autovpa-alerts
spec:
  groups:
    - name: autovpa-alerts
      rules:
        - alert: AutoVPAMetricsMissing
          expr: |
            absent(autovpa_build_info)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: AutoVPA metrics missing
            description: AutoVPA metrics are not being scraped from any target.
        - alert: AutoVPASkipsDetected
          expr: increase(autovpa_vpa_skipped_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: AutoVPA is skipping workloads
            description: >-
              AutoVPA skipped {{ $value }} workload reconciliations in the last 5m
              (reason={{ $labels.reason }}).
